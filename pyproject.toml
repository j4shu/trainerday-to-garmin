[project]
name = "trainerday-to-garmin"
version = "0.1.0"
description = "Upload the latest TrainerDay .tcx to Garmin Connect as Virtual Cycling, then mirror the type to intervals.icu."
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32",
]

# A single-script app, not an installable package: uv just manages the venv.
[tool.uv]
package = false
